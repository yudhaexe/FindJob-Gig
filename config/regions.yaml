# Region hierarchy for "region focus" (DESIGN-SYSTEM §5a).
# A region lists `countries` (ISO-3166 alpha-2) and/or `children` (other regions).
# `aliases` are lowercase words that point to the region in free-text locations.
# Edit freely — no code change needed.

regions:
  ALL: { label: "All regions" }
  GLOBAL_REMOTE: { label: "Worldwide remote" }
  APAC: { label: "Asia Pacific", children: [SEA, EA, SAS, OC], aliases: [apac, asia pacific, asia-pacific, asia] }
  SEA: { label: "Southeast Asia", countries: [ID, SG, MY, TH, VN, PH, KH, MM, LA, BN], aliases: [sea, southeast asia, south east asia, asean] }
  EA: { label: "East Asia", countries: [JP, KR, CN, HK, TW, MN], aliases: [east asia] }
  SAS: { label: "South Asia", countries: [IN, PK, BD, LK, NP], aliases: [south asia] }
  OC: { label: "Oceania", countries: [AU, NZ], aliases: [oceania, anz] }
  EU:
    label: "Europe"
    countries: [GB, IE, DE, NL, BE, LU, FR, ES, PT, IT, CH, AT, PL, CZ, SK, HU, RO, BG, GR, HR, SI, RS, UA, SE, "NO", DK, FI, IS, EE, LV, LT, CY, MT]
    aliases: [europe, eu, emea, european union, cet, cest, eet, wet]
  NA: { label: "North America", countries: [US, CA], aliases: [north america, americas] }
  LATAM: { label: "Latin America", countries: [MX, BR, AR, CO, CL, PE, UY, EC, BO, PY, VE, CR, PA, GT, DO], aliases: [latam, latin america, south america] }
  MEA: { label: "Middle East & Africa", countries: [AE, SA, QA, KW, BH, OM, IL, TR, EG, MA, TN, NG, GH, KE, ZA, ET, UG, TZ, RW], aliases: [mea, middle east, africa, mena, gcc] }


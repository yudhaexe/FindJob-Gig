# Scrape sources (DESIGN-SYSTEM §11–12).
# markets: region codes from regions.yaml where the source is useful ("ALL" = global).
# min_interval: seconds to wait between two requests to the same source.
# page_size: items per request; the runner stops at ScrapeQuery.max_per_source per keyword.

sources:
  freelancer:
    enabled: true
    display_name: "Freelancer.com"
    category: gig
    markets: [ALL]
    min_interval: 1.0
    page_size: 50
    attribution: null

  jobstreet:
    enabled: true
    display_name: "JobStreet ID"
    category: job
    markets: [ID, SEA, APAC]
    min_interval: 1.0
    page_size: 30
    site_key: ID-Main
    base_url: https://id.jobstreet.com
    attribution: null

  himalayas:
    enabled: true
    display_name: "Himalayas"
    category: job
    markets: [ALL]
    min_interval: 1.5
    page_size: 20   # fixed by the API
    attribution: "Jobs from Himalayas (himalayas.app)"

# Named scrape presets: `fjg scrape --preset creative`.
presets:
  creative:
    label: "Creative / Photo & Video"
    keywords: [photographer, videographer, video editor, photo editor, retoucher, fotografer, videografer, editor video, content creator]
    sources: [freelancer, jobstreet, himalayas]
  indonesia:
    label: "Indonesia"
    region: ID
    sources: [jobstreet]

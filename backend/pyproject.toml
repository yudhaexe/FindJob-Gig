[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "findjob-gig"
version = "0.1.0"
description = "Job & gig aggregator — rule-based, no LLM, file storage"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "typer>=0.12",
  "orjson>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fjg = "scraper.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "core*", "scraper*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
